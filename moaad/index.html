<style>
:root{
  --brand:#FF5A36; --brand-2:#FF7A45; --brand-d:#E8451F; --brand-soft:#FFF1EC; --brand-line:#FFCDBD;
  --ink:#18181B; --ink-2:#3F3F46; --sub:#71717A; --mute:#9AA0AA;
  --line:rgba(15,23,42,.06); --line-2:rgba(15,23,42,.10); --line-3:#E4E4E7;
  --bg:#F5F6F8; --card:#FFFFFF;
  --ok:#0E7C4F; --ok-bg:#E9F7F0; --bad:#B42318; --bad-bg:#FEF1F0;
  --warn:#B45309; --warn-bg:#FFF7E8; --info:#1D4ED8; --info-bg:#EEF4FF;
  --r:20px; --r-md:16px; --r-sm:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 10px 30px -18px rgba(15,23,42,.18);
  --shadow-lg:0 32px 64px -32px rgba(15,23,42,.32);
  --grad:linear-gradient(135deg,#FF7A45,#FF5A36 55%,#F0441F);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5; letter-spacing:-.01em;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
::selection{background:#FFD9CC}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--info);text-decoration:none}
img,svg{max-width:100%}
.hidden{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 96px}

/* ── header ─────────────────────────────────────────────── */
.hd{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line)}
.hd-in{max-width:600px;margin:0 auto;height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;flex:none;display:block;filter:drop-shadow(0 5px 11px rgba(255,46,126,.28))}
.mark svg{display:block;width:100%;height:100%}
.wm{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.wm b{font-size:16px;font-weight:800;letter-spacing:.06em;color:#2D333B}
.wm small{font-size:8.5px;font-weight:700;letter-spacing:.18em;color:var(--mute);margin-top:3px}
.hd-r{display:flex;align-items:center;gap:6px;flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F4F4F5;color:var(--ink-2);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700;max-width:150px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ghost{color:var(--sub);font-size:12px;font-weight:700;padding:7px 11px;border-radius:10px;transition:background .15s,color .15s}
.ghost:active,.ghost:hover{background:#F4F4F5;color:var(--ink-2)}

/* ── 로그인 (모아애드 오리지널 · 카드형) ───────────────────
   배경 위에 인풋을 띄우지 않고, 흰 카드 안에 필 뱃지·제목·설명·입력·버튼을
   한 덩어리로 담는다. 단계 안내는 카드 밖 3열 칩으로 분리. */
.hero{margin:20px 0 0;padding:0;color:var(--ink);position:relative}
.hero::before{content:"";position:absolute;left:-16px;right:-16px;top:-24px;height:250px;z-index:0;pointer-events:none;
  background:radial-gradient(88% 72% at 50% -8%,#FFEDE6 0%,rgba(245,246,248,0) 70%)}
.login-card{
  position:relative;z-index:1;background:#fff;border:1px solid #E9EAEE;border-radius:20px;padding:19px 20px 18px;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 24px 48px -30px rgba(15,23,42,.32);
}
.login-card::before{content:"";position:absolute;left:0;right:0;top:0;height:136px;pointer-events:none;
  background:radial-gradient(120% 130% at 0% 0%,#FFF3EE 0%,rgba(255,255,255,0) 68%)}
.login-card>*{position:relative}
.lc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lc-pill{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand-d);border:1px solid var(--brand-line);border-radius:999px;padding:5px 11px 5px 9px;font-size:11px;font-weight:800;letter-spacing:-.15px;line-height:1.2}
.lc-pill i{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(255,90,54,.15);flex:none}
.lc-tag{font-size:9px;font-weight:800;letter-spacing:.2em;color:#C6C9D0;white-space:nowrap}
.login-card h1{font-size:21px;line-height:1.3;letter-spacing:-.9px;font-weight:800;margin:14px 0 6px;color:var(--ink);word-break:keep-all}
.login-card h1 em{font-style:normal;color:var(--brand)}
.login-card .lead{font-size:12.5px;line-height:1.6;color:var(--sub);margin:0 0 17px;word-break:keep-all}
/* 입력칸: 라벨을 칸 안에 넣은 채운(filled) 필드 */
.field{background:#F9FAFB;border:1px solid #ECEDF1;border-radius:14px;padding:8px 13px 0;transition:background .14s,border-color .14s,box-shadow .14s}
.field:focus-within{background:#fff;border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(255,90,54,.10)}
.field + .field{margin-top:9px}
.field label{display:block;margin:0;font-size:10.5px;font-weight:800;letter-spacing:.01em;color:#8A8F99;line-height:1.7}
.field input[type=text],.field input[type=tel],.field input[type=text]:focus,.field input[type=tel]:focus{
  border:0;border-radius:0;background:transparent;box-shadow:none;width:100%;height:36px;padding:0 0 8px;
  font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--ink);font-variant-numeric:tabular-nums;
}
.field input::placeholder{font-weight:600;color:#B6BAC2;letter-spacing:-.1px}
.fld-row{display:flex;align-items:center;gap:9px}
.pin8-pfx{flex:none;position:relative;padding-right:10px;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.01em;line-height:36px;padding-bottom:8px}
.pin8-pfx::after{content:"";position:absolute;right:0;top:6px;height:14px;width:1px;background:#E1E3E8}
/* 버튼: 딥 차콜 + 코랄 아이콘 (참조 이미지의 파랑 풀버튼과 다른 무게) */
.login-btn{
  margin-top:16px;width:100%;height:52px;border-radius:14px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:800;letter-spacing:-.3px;
  box-shadow:0 14px 26px -18px rgba(24,24,27,.85),inset 0 1px 0 rgba(255,255,255,.08);
  transition:transform .12s var(--ease),background .14s;
}
.login-btn:hover{background:#232327}
.login-btn:active{transform:translateY(1px)}
.login-btn:focus-visible{outline:2px solid rgba(255,90,54,.5);outline-offset:2px}
.login-btn:disabled{background:#3F3F46;cursor:not-allowed;transform:none}
.login-btn .lb-ico{width:22px;height:22px;border-radius:8px;background:var(--brand);display:grid;place-items:center;flex:none}
.login-btn .lb-ico svg{width:12px;height:12px;display:block}
#loginCard .hint{text-align:center;margin:11px auto 0;font-size:11.5px;line-height:1.6;color:var(--sub);white-space:pre-line;max-width:32em}
/* 단계 안내: 카드 밖 3열 칩 */
.steps{position:relative;z-index:1;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:11px 0 0;padding:0}
.steps li{background:#fff;border:1px solid #E9EAEE;border-radius:14px;padding:10px 8px 9px;text-align:center;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.steps b{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--brand);margin-bottom:3px}
.steps span{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);letter-spacing:-.25px;line-height:1.35;word-break:keep-all}
.err-text{color:var(--bad)!important;font-weight:700}

/* ── cards & form ───────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:12px}
h1{font-size:20px;margin:0 0 6px;letter-spacing:-.6px;font-weight:800}
h2{font-size:16px;margin:0;letter-spacing:-.4px;font-weight:800}
h3{font-size:15px;margin:0;letter-spacing:-.3px;font-weight:800}
.sub{color:var(--sub);font-size:12.5px;line-height:1.6;margin:0 0 4px;word-break:keep-all}
label{display:block;font-size:12px;font-weight:700;color:#52525B;margin:14px 0 6px;letter-spacing:-.1px}
label .opt{font-weight:500;color:var(--mute)}
input::placeholder,textarea::placeholder{color:#B4B8C0;opacity:1}
/* 입력칸 폭 정규화 — 아이폰 사파리에서 칸이 카드 밖으로 삐져나오지 않게 */
input,select,textarea{width:100%;max-width:100%;min-width:0;box-sizing:border-box;display:block}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=search],textarea,select,input:not([type]){
  border:1px solid var(--line-3);border-radius:14px;padding:12px 13px;background:#fff;outline:none;font-size:15px;
  transition:border-color .14s,box-shadow .14s,background .14s;
}
input:hover,select:hover,textarea:hover{border-color:#D6D8DE}
input:focus,textarea:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px rgba(255,90,54,.12)}
textarea{min-height:74px;resize:vertical;line-height:1.6}
/* 한 줄 칸은 높이를 똑같이 — select·date·text 가 섞여도 들쭉날쭉하지 않게 */
input:not([type=file]),select{height:50px;line-height:1.2}
input[type=date]{text-align:left;-webkit-appearance:none;appearance:none}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.row>*{flex:1 1 0;min-width:0}
.cell46{flex:0 0 46%}

/* 자주 쓰는 값 원터치 칩 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
.chips button{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.03);transition:.14s}
.chips button.on{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d);box-shadow:none}
.chips button:active{background:var(--brand-soft);border-color:var(--brand-line);color:var(--brand-d)}
/* 자동완성 */
.aca{position:relative;min-width:0;flex:1 1 0}
.aca .ac-list{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:45;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 6px rgba(15,23,42,.05),0 18px 34px -18px rgba(15,23,42,.28);display:none;max-height:232px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px}
.aca .ac-list.on{display:block}
.aca .ac-item{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:11px 11px;font-size:13.5px;font-weight:600;color:var(--ink);text-align:left;border-radius:11px;background:#fff}
.aca .ac-item.on{background:var(--brand-soft)}
.aca .ac-item em{font-style:normal;font-weight:800;color:var(--brand-d)}
.aca .ac-item small{font-size:11px;font-weight:700;color:var(--mute)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:12px 15px;font-weight:700;font-size:13.5px;letter-spacing:-.1px;border:1px solid var(--line-2);background:#fff;color:var(--ink-2);white-space:nowrap;transition:transform .12s var(--ease),box-shadow .14s,background .14s}
.btn:active{transform:translateY(1px)}
.btn:hover{background:#FCFCFD}
.btn.primary:hover{filter:brightness(1.03)}
.btn:focus-visible,.chips button:focus-visible,.tabs button:focus-visible{outline:2px solid rgba(255,90,54,.5);outline-offset:2px}
.btn.primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 10px 22px -14px rgba(240,68,31,.9)}
.btn.primary:active{box-shadow:0 6px 14px -12px rgba(240,68,31,.9)}
.btn.primary:disabled{background:#F3BBAE;box-shadow:none;cursor:not-allowed;transform:none}
.btn.wide{width:100%}
.btn.sm{padding:9px 12px;font-size:12.5px;border-radius:11px}
.btn.ok{background:#13915E;border-color:#13915E;color:#fff;box-shadow:0 8px 18px -14px rgba(19,145,94,.9)}
.btn.bad{background:#fff;border-color:#F3C1BC;color:var(--bad)}
.hint{font-size:12px;line-height:1.55;color:var(--sub);margin:10px 0 0;word-break:keep-all}
.msg{margin-top:10px;padding:12px 14px;border-radius:14px;font-size:12.5px;line-height:1.55;border:1px solid transparent}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:rgba(180,35,24,.08)}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:rgba(14,124,79,.08)}
.msg.info{background:var(--info-bg);color:var(--info);border-color:rgba(29,78,216,.08)}
.msg.warn{background:var(--warn-bg);color:var(--warn);border-color:rgba(180,83,9,.08)}

/* ── section ────────────────────────────────────────────── */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 2px 10px}
.sec-h h2{font-size:13px;color:var(--ink);letter-spacing:-.2px;font-weight:800}
.sec-h h2 .sec-n{color:var(--brand-d);font-weight:800;margin-left:1px}

/* ── campaign list ──────────────────────────────────────── */
.list{display:grid;gap:10px}
.camp{padding:16px;display:block;position:relative;transition:transform .16s var(--ease),box-shadow .16s}
.camp:active{transform:scale(.994)}
.camp-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.badge{display:inline-block;background:#F4F4F5;color:#52525B;font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px;letter-spacing:-.1px}
.badge.hot{background:var(--brand-soft);color:#C2410C}
.pay{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.8px;font-variant-numeric:tabular-nums}
.camp h3{font-size:15px;line-height:1.42;margin:0 0 5px;word-break:keep-all;font-weight:800;letter-spacing:-.35px}
.meta{font-size:12px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;line-height:1.5}
.bar{height:5px;border-radius:99px;background:#F1F2F4;margin:13px 0 11px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .35s var(--ease)}
.camp-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.remain{font-size:12px;font-weight:600;color:var(--sub);letter-spacing:-.1px}
.remain em{font-style:normal;color:var(--brand-d);font-weight:800}
.remain.zero{color:var(--mute)}

/* ── me ─────────────────────────────────────────────────── */
.me{padding:16px 16px 14px}
.me-top{display:flex;align-items:flex-start;gap:12px}
.me-top>button{flex:none;margin-top:-2px}
.avatar{width:44px;height:44px;border-radius:15px;background:var(--brand-soft);color:var(--brand-d);display:grid;place-items:center;font-weight:800;font-size:16px;flex:none;border:1px solid var(--brand-line)}
.me-info{flex:1;min-width:0}
.me-info b{display:block;font-size:16.5px;letter-spacing:-.55px;font-weight:800;line-height:1.34;word-break:keep-all}
.me-info span{font-size:12.5px;color:var(--sub);display:block;line-height:1.5;margin-top:4px;word-break:keep-all}
.me-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.me-meta span{font-size:11px;font-weight:700;color:#52525B;background:#F4F4F5;border-radius:8px;padding:5px 9px;letter-spacing:-.1px}
.me-meta span.ok{background:var(--ok-bg);color:var(--ok)}
.me-meta span.todo{background:var(--warn-bg);color:var(--warn)}

/* ── skeleton ───────────────────────────────────────────── */
.sk{background:linear-gradient(100deg,#EEF0F3 30%,#F7F8FA 50%,#EEF0F3 70%);background-size:200% 100%;animation:sh 1.1s infinite linear;border-radius:8px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-card{height:136px;border-radius:var(--r);border:1px solid var(--line);background:#fff;padding:16px}
.sk-line{height:11px;margin-bottom:10px}

/* ── empty ──────────────────────────────────────────────── */
.empty{text-align:center;padding:34px 16px;color:var(--sub);font-size:12.5px;line-height:1.6}
.empty b{display:block;color:var(--ink-2);font-size:13.5px;font-weight:800;margin-bottom:5px}

/* ── sheet ──────────────────────────────────────────────── */
.dim{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s}
.dim.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-radius:26px 26px 0 0;max-height:93vh;display:flex;flex-direction:column;transform:translateY(102%);transition:transform .28s var(--ease);box-shadow:0 -20px 50px -20px rgba(15,23,42,.3)}
.sheet::before{content:"";position:absolute;top:9px;left:50%;margin-left:-18px;width:36px;height:4px;border-radius:99px;background:#E4E4E7}
.sheet.on{transform:translateY(0)}
.sheet-in{max-width:600px;width:100%;margin:0 auto;display:flex;flex-direction:column;min-height:0;max-height:93vh}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:22px 18px 12px;gap:8px;flex:none}
.sheet-head h3{font-size:16px;letter-spacing:-.4px;padding-right:8px;word-break:keep-all}
.x{width:32px;height:32px;border-radius:50%;background:#F4F4F5;color:var(--sub);font-size:18px;line-height:1;display:grid;place-items:center;flex:none;transition:.14s}
.x:active{background:#E9E9EB}
.sheet-body{padding:4px 18px 26px;overflow:auto;-webkit-overflow-scrolling:touch}

/* ── key-value ──────────────────────────────────────────── */
.kv{display:grid;gap:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;background:#FCFCFD}
.kv>div{display:flex;gap:10px;padding:11px 13px;font-size:12.5px;border-bottom:1px solid var(--line);line-height:1.5}
.kv>div:last-child{border-bottom:0}
.kv span{color:var(--sub);width:84px;flex:none;font-size:12px}
.kv b{font-weight:700;word-break:break-all;flex:1;color:var(--ink-2)}
.guide{background:#FAFAFB;border:1px solid var(--line);border-radius:16px;padding:13px;font-size:12.5px;line-height:1.65;white-space:pre-wrap;color:var(--ink-2);max-height:190px;overflow:auto;margin-bottom:12px;word-break:keep-all}
.actions{display:grid;gap:8px;margin-top:6px}
.actions .row>a,.actions .row>button{flex:1}

/* ── capture picker ─────────────────────────────────────── */
.pick{border:1.5px dashed #DCDEE4;border-radius:16px;padding:18px 14px;text-align:center;color:var(--sub);font-size:12px;background:#FAFBFC;position:relative;overflow:hidden;transition:.15s}
.pick:active{background:#FFF7F4;border-color:var(--brand-line)}
.pick input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pick b{display:block;color:var(--ink);font-weight:800;font-size:13px;margin-bottom:4px}
.pick-sub{font-size:11.5px;color:var(--mute);line-height:1.5}
.thumb{margin-top:10px;position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.thumb img{display:block;width:100%;max-height:230px;object-fit:contain;background:#F4F4F5}
.thumb .cap{font-size:11px;color:var(--sub);padding:7px 10px;background:#fff}
.thumb .del{position:absolute;top:8px;right:8px;background:rgba(24,24,27,.78);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:5px 9px;backdrop-filter:blur(4px)}
.ocr{margin-top:10px;font-size:12px;color:var(--info);display:flex;align-items:center;gap:7px;line-height:1.5}

/* ── details ────────────────────────────────────────────── */
details{border:1px solid var(--line);border-radius:16px;padding:0;margin-top:16px;overflow:hidden;background:#FCFCFD}
details>summary{list-style:none;padding:13px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"⌄";color:var(--mute);font-size:14px;line-height:1;transition:transform .2s}
details[open]>summary::after{content:"⌃"}
details .db{padding:0 14px 14px}

/* ── toast ──────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;background:rgba(24,24,27,.95);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:-.1px;padding:12px 17px;border-radius:14px;opacity:0;pointer-events:none;transition:.22s var(--ease);max-width:88vw;text-align:center;box-shadow:0 16px 36px -16px rgba(15,23,42,.6);backdrop-filter:blur(8px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── progress ───────────────────────────────────────────── */
.prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:600;margin-top:12px;line-height:1.5}
.spin{width:15px;height:15px;border:2px solid #FFD9CF;border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── status chips ───────────────────────────────────────── */
.st{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:9px;white-space:nowrap;letter-spacing:-.1px;flex:none}
.st.wait{background:var(--info-bg);color:var(--info)}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.no{background:var(--bad-bg);color:var(--bad)}
.st.done{background:#F1F2F4;color:#52525B}

/* ── submissions ────────────────────────────────────────── */
.sub-item{padding:14px 16px;border-bottom:1px solid var(--line);font-size:12.5px}
.sub-item:last-child{border-bottom:0}
.sub-item .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.sub-item .p{font-weight:800;font-size:13.5px;margin-bottom:4px;word-break:keep-all;letter-spacing:-.2px}
.sub-item .d{color:var(--sub);font-size:11.5px;display:flex;gap:8px;flex-wrap:wrap;margin-top:3px;line-height:1.5}
.sub-item .links{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

/* ── admin dashboard ────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.stat{background:#fff;padding:10px 12px;min-height:58px;display:flex;flex-direction:column;justify-content:center;border:0;border-radius:0}
.stat span{display:block;font-size:10.5px;color:#8A8F98;font-weight:700;margin-bottom:3px;letter-spacing:-.1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:15px;letter-spacing:-.5px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.2}
.stat b em{font-size:10.5px;font-style:normal;font-weight:700;color:var(--mute);margin-left:1px}
.stat.hot b{color:var(--brand-d)}
.stat.money b{font-size:13.5px;letter-spacing:-.4px}

/* 세그먼트 컨트롤 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:rgba(237,239,242,.94);backdrop-filter:blur(12px);border-radius:15px;padding:4px;margin-bottom:12px;position:sticky;top:60px;z-index:20;box-shadow:inset 0 0 0 1px rgba(15,23,42,.03)}
.tabs button{padding:9px 4px;border-radius:11px;font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:-.2px;transition:background .16s,color .16s,box-shadow .16s}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.06),0 6px 14px -10px rgba(15,23,42,.3)}

.ad-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px;box-shadow:0 1px 2px rgba(15,23,42,.03)}
.ad-card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ad-card .tiny{font-size:11.5px;color:var(--sub);line-height:1.55}
.ad-card .tiny b{color:var(--ink-2);font-weight:700}
.foot-note{text-align:center;color:var(--mute);font-size:10.5px;letter-spacing:.02em;padding:26px 0 10px}
.seg{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}
.seg button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;transition:.14s}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* 등록 폼 */
.form-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.form-title{font-size:16px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px}
.form-tag{flex:none;font-size:9.5px;font-weight:800;letter-spacing:.1em;color:var(--brand-d);background:var(--brand-soft);border:1px solid var(--brand-line);border-radius:8px;padding:4px 8px}
.fsec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.fsec.first{margin-top:14px;padding-top:0;border-top:0}
.fsec-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#71717A;margin:0 0 2px}
.fsec-h::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--brand);flex:none}
.fsec .tiny{margin-top:3px}
.form-foot{margin-top:20px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff;-webkit-overflow-scrolling:touch}
table.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:620px}
table.tbl th{background:#FAFAFB;color:var(--sub);font-weight:700;text-align:left;padding:10px 11px;white-space:nowrap;border-bottom:1px solid var(--line);font-size:11.5px}
table.tbl td{padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink-2)}
table.tbl tr:last-child td{border-bottom:0}
table.tbl td a{font-weight:700}
.progline{height:8px;border-radius:99px;background:#F1F2F4;overflow:hidden;margin:12px 0 10px}
.progline i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .4s var(--ease)}
.cv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cv-num{font-size:24px;font-weight:800;letter-spacing:-.9px;font-variant-numeric:tabular-nums}
.cv-num em{font-size:12.5px;font-style:normal;color:var(--sub);font-weight:700;margin-left:3px}

/* 아주 좁은 화면에서는 날짜 두 칸을 한 줄씩 — 날짜 글자가 잘리지 않게 */
@media(max-width:359px){
  .row.dates>*{flex:1 1 100%}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:480px){
  /* 아이폰은 16px 미만 입력칸에서 화면을 확대하므로 16px로 고정 */
  input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],textarea,select,input:not([type]){font-size:16px}
}
@media(min-width:720px){
  .wrap{max-width:860px}
  .hd-in{max-width:860px}
  .list{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(6,minmax(0,1fr))}
  .sheet-in{max-width:660px}
  .hero{max-width:440px;margin:34px auto 0}
  .login-card h1{font-size:22px}
  /* 리뷰어·업체 화면은 한 줄이 너무 길어지지 않게 좁은 단으로 */
  #rv{max-width:560px;margin:0 auto}
  #rv .list{grid-template-columns:1fr}
  #cv{max-width:760px;margin:0 auto}
  body[data-mode="reviewer"] .hd-in{max-width:560px}
  body[data-mode="client"] .hd-in{max-width:760px}
}
</style>
</head>
<body>

<header class="hd">
  <div class="hd-in">
    <div class="logo">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 100 99" xmlns="http://www.w3.org/2000/svg" focusable="false"><defs><linearGradient id="moaadMarkG" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A45"/><stop offset=".5" stop-color="#FF5E62"/><stop offset="1" stop-color="#FF2E7E"/></linearGradient></defs><path fill="url(#moaadMarkG)" d="M28.94 0H71.06A28.94 30.1 0 0 1 100 30.1V68.9A28.94 30.1 0 0 1 71.06 99H28.94A28.94 30.1 0 0 1 0 68.9V30.1A28.94 30.1 0 0 1 28.94 0Z"/><path fill="none" stroke="#fff" stroke-width="16.2" stroke-linecap="round" stroke-linejoin="round" d="M18.88 65.03 31.95 34.25 50 58 68.05 34.25 81.12 65.03"/></svg></span>
      <span class="wm"><b>MOAAD</b><small>REVIEW MARKETING</small></span>

</header>

<main class="wrap" id="app">

  <!-- ══ 리뷰어 ══ -->
  <section id="rv" class="hidden">
    <section id="rvHero" class="hero">
      <div id="loginCard" class="login-card">
        <div class="lc-top">
          <span class="lc-pill"><i aria-hidden="true"></i>모아애드 체험단</span>
          <span class="lc-tag" aria-hidden="true">MOA AD</span>

        <h1>리뷰 체험단 <em>로그인</em></h1>

          </div>

        <button id="lgBtn" class="login-btn"><span class="lb-tx">로그인</span><span class="lb-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h12M13 7l5 5-5 5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
        <p id="lgMsg" class="hint">처음이면 그냥 로그인하세요.
제출할 때 배송지·계좌가 자동 저장돼요.</p>

      <div id="campList" class="list">

        <div class="sk-card"><div class="sk sk-line" style="width:30%"></div><div class="sk sk-line" style="width:66%;height:15px"></div><div class="sk sk-line" style="width:44%"></div><div class="sk" style="height:6px;margin-top:18px"></div></div>
      </div>

<script>
/* ══════════════════════════════════════════════════════════════
   모아애드 클라이언트 — 프레임워크 없음, 첫 페인트 우선
   ══════════════════════════════════════════════════════════════ */
/* ── 정적 페이지 부트스트랩 (GitHub Pages) ──────────────────
   서버 템플릿 대신 주소창 파라미터를 직접 읽는다.
   ?page=admin → 관리자 / ?page=client&cid=..&t=.. → 업체 / 그 외 → 리뷰어 */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbx9EhUzG80DRCK2GyhETpjX_rGnZVwAUJ3XA_h3oI6lpl23-ukkZHuy0pw2UMTZQizB5Q/exec';
var VER = '1.1.0';
var QS = new URLSearchParams(window.location.search || '');
var PAGE = String(QS.get('page') || '').toLowerCase();
var MODE = (PAGE === 'admin') ? 'admin' : (PAGE === 'client' ? 'client' : 'reviewer');
function qsSafe(name){ return String(QS.get(name) || '').replace(/[^A-Za-z0-9_\-]/g, '').substring(0, 80); }
var CLIENT_CID = MODE === 'client' ? qsSafe('cid') : '';
var CLIENT_TOKEN = MODE === 'client' ? qsSafe('t') : '';
/* 이 페이지가 놓인 폴더 (예: https://moaad-kr.github.io/) */
var BASE_DIR = (function(){
  var p = String(location.pathname || '/');
  return location.origin + p.replace(/[^\/]*$/, '');
})();

var state = {
  me: null,
  profile: null,
  campaigns: [],
  submissions: [],
  adminPin: '',
  admin: null,
  tab: 'campaigns',
  form: null,
  filter: 'all',
  busy: false
};

/* ── 유틸 ─────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function won(n){ return (Number(n)||0).toLocaleString('ko-KR'); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function setVer(){
  var els = document.querySelectorAll('.ver');
  for (var i = 0; i < els.length; i++) els[i].textContent = VER;
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.classList.remove('on'); }, 2400);
}
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var done = false;
    var timer = setTimeout(function(){
      if (done) return; done = true;
      reject(new Error('응답이 늦어지고 있습니다. 잠시 후 다시 시도해 주세요.'));
    }, 45000);
    var settle = function(ok, val){
      if (done) return; done = true; clearTimeout(timer);
      if (ok) resolve(val); else reject(val instanceof Error ? val : new Error(String(val)));
    };
    try {
      fetch(GAS_URL, {
        method: 'POST',
        credentials: 'omit',          /* 구글 다중 로그인 쿠키를 싣지 않는다 → 드라이브 오류 방지 */
        redirect: 'follow',
        cache: 'no-store',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },  /* 프리플라이트 없이 doPost 도달 */
        body: JSON.stringify({ fn: fn, args: args })
      }).then(function(r){
        if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')');
        return r.text();
      }).then(function(txt){
        var out = null;
        try { out = JSON.parse(txt); }
        catch (e) { throw new Error('서버 응답을 읽지 못했습니다. 잠시 후 다시 시도해 주세요.'); }
        if (!out || out.ok !== true) { settle(false, new Error((out && out.error) || '요청을 처리하지 못했습니다.')); return; }
        settle(true, out.data);
      }).catch(function(err){ settle(false, err); });
    } catch (e) { settle(false, e); }
  });
}
function copyText(txt, msg){
  if (!txt) return;
  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast(msg || '복사했어요'); }
  catch (e) { toast('복사가 안 되면 길게 눌러 복사해 주세요'); }
  document.body.removeChild(ta);
}
function imgFromFile(file, maxDim, quality){
  return new Promise(function(resolve, reject){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try {
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img, 0, 0, cw, ch);
        var dataUrl = c.toDataURL('image/jpeg', quality || 0.72);
        URL.revokeObjectURL(url);
        resolve({ dataUrl: dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg', w: cw, h: ch });
      } catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('이미지를 읽지 못했습니다.')); };
    img.src = url;
  });
}

var sheetOpen = false;
function openSheet(title, html){
  $('shTitle').textContent = title;
  $('shBody').innerHTML = html;
  $('sheet').classList.remove('hidden');
  $('dim').classList.remove('hidden');
  requestAnimationFrame(function(){
    $('sheet').classList.add('on');
    $('dim').classList.add('on');
    $('shBody').scrollTop = 0;
  });
  sheetOpen = true;
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  $('sheet').classList.remove('on');
  $('dim').classList.remove('on');
  sheetOpen = false;
  state.form = null;
  document.body.style.overflow = '';
  setTimeout(function(){
    if (!sheetOpen) { $('sheet').classList.add('hidden'); $('dim').classList.add('hidden'); }
  }, 220);
}
$('dim').addEventListener('click', closeSheet);

function initReviewer(){
  $('rv').classList.remove('hidden');
  setVer();

  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('moa_me') || 'null'); } catch (e) {}
  if (saved && saved.name) $('lgName').value = saved.name;
  if (saved && saved.name && saved.pin && String(saved.pin).length === 8) {
    $('lgPin').value = saved.pin;
    doLogin(true);
  }

  $('lgBtn').addEventListener('click', function(){ doLogin(false); });
  $('lgPin').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(false); });
  /* 붙여넣기·자동입력으로 들어온 문자는 숫자만 8자리로 */
  $('lgPin').addEventListener('input', function(){
    var v = (this.value || '').replace(/[^0-9]/g, '').slice(0, 8);
    if (v !== this.value) this.value = v;
  });
  $('refreshBtn').addEventListener('click', function(){
    $('refreshBtn').textContent = '불러오는 중…';
    loadCampaigns(true).then(function(){ $('refreshBtn').textContent = '새로고침'; });
  });

  loadCampaigns(false);
}

function loadCampaigns(force){
  return call('getActiveCampaigns', !!force).then(function(res){
    if (!res || !res.ok) throw new Error((res && res.message) || '캠페인을 불러오지 못했습니다.');
    state.campaigns = res.campaigns || [];
    renderCampaigns();
    if (force) toast(state.campaigns.length ? state.campaigns.length + '개 캠페인' : '진행 중인 캠페인이 없습니다');
  }).catch(function(err){
    $('campList').innerHTML = '<div class="empty"><b>불러오기 실패</b>' + esc(err.message || err) + '<br><br><button class="btn sm" onclick="loadCampaigns(true)">다시 시도</button></div>';
  });
}

function setLoginMsg(text, isErr){
  var el = $('lgMsg');
  el.textContent = text;
  el.className = isErr ? 'hint err-text' : 'hint';
}

function setLoginBtn(text){
  var el = $('lgBtn');
  var tx = el.querySelector('.lb-tx');
  if (tx) tx.textContent = text; else el.textContent = text;
}

function doLogin(silent){
  var name = $('lgName').value.trim();
  var pin = ($('lgPin').value || '').replace(/[^0-9]/g, '');
  if (!name || pin.length !== 8) {
    if (!silent) { setLoginMsg('이름과 휴대폰 번호 뒤 8자리를 넣어 주세요.', true); }
    return;
  }
  $('lgBtn').disabled = true;
  setLoginBtn('확인 중…');
  call('loginReviewer', name, pin).then(function(res){
    $('lgBtn').disabled = false;
    setLoginBtn('로그인');
    if (!res || !res.ok) {
      setLoginMsg((res && res.message) || '확인하지 못했습니다.', true);
      return;
    }
    state.me = { name: name, pin: pin };
    try { localStorage.setItem('moa_me', JSON.stringify(state.me)); } catch (e) {}
    setLoginMsg('처음이면 그냥 로그인하세요.\n제출할 때 배송지·계좌가 자동 저장돼요.', false);
    state.profile = res.found ? res.profile : null;
    $('rvHero').classList.add('hidden');
    $('loginCard').classList.add('hidden');
    $('rvMain').classList.remove('hidden');
    renderMe();
    loadMySubmissions();
    if (res.found) {
      if (!silent) toast(res.profile.name + ' 님, 저장된 정보를 불러왔어요');
    } else {
      toast('처음이시네요. 배송·계좌 정보를 입력하면 자동 저장됩니다');
    }
  }).catch(function(err){
    $('lgBtn').disabled = false;
    setLoginBtn('로그인');
    setLoginMsg(err.message || '확인 실패', true);
  });
}

function logout(){
  state.me = null; state.profile = null; state.submissions = [];
  try { localStorage.removeItem('moa_me'); } catch (e) {}
  $('rvMain').classList.add('hidden');
  $('rvHero').classList.remove('hidden');
  $('loginCard').classList.remove('hidden');
  $('loginChip').classList.add('hidden');
  $('lgPin').value = '';
  $('lgBtn').disabled = false;
  setLoginBtn('로그인');
  setLoginMsg('처음이면 그냥 로그인하세요.\n제출할 때 배송지·계좌가 자동 저장돼요.', false);
}

function renderMe(){
  var p = state.profile;
  var nm = p ? p.name : state.me.name;
  var el = $('meCard');
  var chips = '';
  if (p) {
    chips += '<span class="' + (p.address ? 'ok' : 'todo') + '">' + (p.address ? '배송지 저장됨' : '배송지 없음') + '</span>';
    chips += '<span class="' + (p.bank && p.account ? 'ok' : 'todo') + '">' + (p.bank && p.account ? '계좌 저장됨' : '계좌 없음') + '</span>';
    if (p.nickname) chips += '<span>닉네임 ' + esc(p.nickname) + '</span>';
  } else {
    chips += '<span class="todo">첫 제출 때 배송지·계좌가 자동 저장돼요</span>';
  }
  el.innerHTML =
    '<div class="me-top">' +
      '<div class="avatar">' + esc(nm.substring(0,1)) + '</div>' +
      '<div class="me-info">' +
        '<b>' + esc(nm) + '님, 안녕하세요</b>' +
        '<span>지금 모집 중인 체험단 현황 알려드려요</span>' +
      '</div>' +
      '<button class="ghost" data-act="logout">로그아웃</button>' +
    '</div>' +
    '<div class="me-meta">' + chips + '</div>';
  $('loginChip').textContent = nm + ' 님';
  $('loginChip').classList.remove('hidden');
}

function renderCampaigns(){
  var list = state.campaigns;
  if ($('campCount')) $('campCount').textContent = list.length;
  if (!list.length) {
    $('campList').innerHTML = '<div class="empty"><b>지금 열린 캠페인이 없어요</b>새 캠페인이 올라오면 여기에서 바로 신청할 수 있습니다.</div>';
    return;
  }
  var html = list.map(function(c){
    var pct = c.quota > 0 ? Math.min(100, Math.round((c.done / c.quota) * 100)) : 0;
    var left = c.quota - c.done;
    var dday = '';
    if (c.endDate) {
      var t = Date.parse(c.endDate + 'T23:59:59+09:00');
      if (isFinite(t)) {
        var d = Math.ceil((t - Date.now()) / 86400000);
        dday = d < 0 ? '마감 지남' : (d === 0 ? '오늘 마감' : 'D-' + d);
      }
    }
    var meta = [];
    if (c.store) meta.push(esc(c.store));
    if (dday) meta.push(esc(dday));
    if (c.productKey) meta.push('상품키 ' + '<span style="font-family:ui-monospace,monospace">' + esc(c.productKey) + '</span>');
    return '<article class="camp card">' +
      '<div class="camp-top"><span class="badge' + (left <= 3 ? ' hot' : '') + '">' + esc(c.platform || '온라인') + '</span>' +
        '<span class="pay">' + won(c.payout) + '원</span></div>' +
      '<h3>' + esc(c.product) + '</h3>' +
      '<div class="meta">' + meta.join(' · ') + '</div>' +
      '<div class="meta" style="margin-top:4px;color:#475467">페이백 ' + won(c.payback) + '원' +
        (c.reviewFee ? ' + 리뷰비 ' + won(c.reviewFee) + '원' : '') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="camp-foot">' +
        '<span class="remain' + (left <= 0 ? ' zero' : '') + '">남은 자리 <em>' + left + '</em> / ' + c.quota + '명</span>' +
        '<button class="btn primary sm" data-act="detail" data-id="' + esc(c.id) + '">신청하기</button>' +
      '</div></article>';
  }).join('');
  $('campList').innerHTML = html;
}

function findCampaign(id){
  for (var i = 0; i < state.campaigns.length; i++) if (state.campaigns[i].id === id) return state.campaigns[i];
  return null;
}

function openDetail(id){
  var c = findCampaign(id);
  if (!c) return;
  var rows = [];
  rows.push('<div><span>플랫폼</span><b>' + esc(c.platform || '-') + '</b></div>');
  rows.push('<div><span>스토어</span><b>' + esc(c.store || '-') + '</b></div>');
  rows.push('<div><span>상품명</span><b>' + esc(c.product) + '</b></div>');
  if (c.productKey) rows.push('<div><span>상품키</span><b>' + esc(c.productKey) + '</b></div>');
  rows.push('<div><span>모집</span><b>' + c.done + ' / ' + c.quota + '명 (남은 ' + (c.quota - c.done) + ')</b></div>');
  if (c.startDate || c.endDate) rows.push('<div><span>기간</span><b>' + esc(c.startDate || '?') + ' ~ ' + esc(c.endDate || '?') + '</b></div>');
  rows.push('<div><span>페이백</span><b>' + won(c.payback) + '원</b></div>');
  rows.push('<div><span>리뷰비</span><b>' + won(c.reviewFee) + '원</b></div>');
  rows.push('<div><span>실지급 예상</span><b>' + won(c.payout) + '원</b></div>');

  var html = '<div class="kv">' + rows.join('') + '</div>';
  if (c.guide) {
    html += '<label>가이드 · 키워드</label><div class="guide">' + esc(c.guide) + '</div>';
  }
  if (c.note) {
    html += '<div class="msg warn">' + esc(c.note) + '</div>';
  }
  html += '<div class="actions">';
  if (c.guide) html += '<button class="btn wide" data-act="copy" data-text="' + esc(c.guide) + '">가이드 복사</button>';
  if (c.link) html += '<a class="btn wide" href="' + esc(c.link) + '" target="_blank" rel="noopener">구매링크 열기 ↗</a>';
  html += '<button class="btn primary wide" data-act="goform" data-id="' + esc(c.id) + '">구매했어요 · 제출하기</button>';
  html += '</div>';
  html += '<p class="hint">제출 전에 구매계정으로 중복(상중·스중)을 자동 확인합니다.</p>';
  openSheet(c.product, html);
}

function bindForm(){
  var acc = $('fAccount');
  if (acc) {
    var timer = null;
    acc.addEventListener('input', function(){
      clearTimeout(timer);
      var v = acc.value.trim();
      $('dupBox').innerHTML = '';
      state.form.dup = null;
      if (v.length < 2) return;
      timer = setTimeout(function(){ runDup(v); }, 550);
    });
    acc.addEventListener('blur', function(){ if (acc.value.trim().length >= 2 && !state.form.dup) runDup(acc.value.trim()); });
  }
  var of = $('fOrderFile');
  if (of) of.addEventListener('change', function(){ handleCapture(of.files[0], 'order'); });
  var rf = $('fReviewFile');
  if (rf) rf.addEventListener('change', function(){ handleCapture(rf.files[0], 'review'); });
}

function runDup(account){
  if (!state.form) return;
  state.form.dupBusy = true;
  $('dupBox').innerHTML = '<div class="ocr"><span class="spin"></span>중복 확인 중…</div>';
  call('checkDuplicate', state.form.campaignId, account).then(function(res){
    if (!state.form) return;
    state.form.dupBusy = false;
    state.form.dup = res;
    if (!res || res.ok === false) {
      $('dupBox').innerHTML = '<div class="msg err">' + esc((res && res.message) || '확인 실패') + '</div>';
      return;
    }
    if (res.allowed) {
      $('dupBox').innerHTML = '<div class="msg ok">중복 없음 — 제출할 수 있습니다.</div>';
    } else {
      var extra = res.remainingDays ? ' (' + res.remainingDays + '일 후 가능)' : '';
      $('dupBox').innerHTML = '<div class="msg err"><b>' + esc(res.label || '중복') + '</b> · ' + esc(res.message + extra) + '</div>';
    }
  }).catch(function(err){
    if (!state.form) return;
    state.form.dupBusy = false;
    $('dupBox').innerHTML = '<div class="msg warn">중복 확인을 못 했습니다. 제출할 때 다시 확인합니다.</div>';
  });
}

function handleCapture(file, kind){
  if (!file) return;
  var box = $(kind === 'order' ? 'orderPreview' : 'reviewPreview');
  box.innerHTML = '<div class="ocr"><span class="spin"></span>사진 준비 중…</div>';
  if (!state.form) return;
  state.form.lock = true;
  imgFromFile(file, 1500, 0.72).then(function(img){
    if (!state.form) return;
    state.form[kind] = img;
    state.form.lock = false;
    box.innerHTML =
      '<div class="thumb"><img src="' + img.dataUrl + '" alt="캡처">' +
      '<div class="cap">' + img.w + '×' + img.h + ' · ' + Math.round((img.base64.length * 0.75) / 1024) + 'KB</div>' +
      '<button class="del" data-act="delcap" data-kind="' + kind + '">삭제</button></div>';
    if (kind === 'order') runOcr(img);
  }).catch(function(err){
    if (!state.form) return;
    state.form.lock = false;
    box.innerHTML = '';
    toast(err.message || '사진을 읽지 못했습니다');
  });
}

function runOcr(img){
  state.form.ocrBusy = true;
  $('ocrBox').innerHTML = '<div class="ocr"><span class="spin"></span>주문 캡처에서 번호·금액 읽는 중…</div>';
  call('extractOrderInfo', img.base64, img.mimeType).then(function(res){
    if (!state.form) return;
    state.form.ocrBusy = false;
    if (res && res.ok) {
      if (res.orderNo && $('fOrderNo') && !$('fOrderNo').value) $('fOrderNo').value = res.orderNo;
      if (res.amount && $('fAmount') && !$('fAmount').value) $('fAmount').value = String(res.amount);
      var got = [];
      if (res.orderNo) got.push('주문번호 ' + res.orderNo);
      if (res.amount) got.push('결제금액 ' + won(res.amount) + '원');
      $('ocrBox').innerHTML = got.length
        ? '<div class="msg ok">캡처에서 읽었어요: ' + esc(got.join(' · ')) + ' — 다르면 직접 고쳐 주세요.</div>'
        : '<div class="msg warn">캡처에서 값을 찾지 못했습니다. 직접 입력해 주세요.</div>';
    } else if (res && res.needKey) {
      $('ocrBox').innerHTML = '<div class="msg info">자동 인식 꺼짐 — 주문번호를 직접 입력해 주세요.</div>';
    } else {
      $('ocrBox').innerHTML = '<div class="msg warn">' + esc((res && res.message) || '자동 인식 실패 — 직접 입력해 주세요.') + '</div>';
    }
  }).catch(function(){
    if (!state.form) return;
    state.form.ocrBusy = false;
    $('ocrBox').innerHTML = '<div class="msg warn">자동 인식 실패 — 직접 입력해 주세요.</div>';
  });
}

function doSubmit(){
  if (!state.form || state.form.busy) return;
  var f = state.form;
  var account = ($('fAccount') && $('fAccount').value.trim()) || '';
  var orderNo = ($('fOrderNo') && $('fOrderNo').value.trim()) || '';
  var amount = Number((($('fAmount') && $('fAmount').value) || '0').replace(/[^0-9]/g, '')) || 0;
  var receiver = ($('fReceiver') && $('fReceiver').value.trim()) || '';
  var address = ($('fAddress') && $('fAddress').value.trim()) || '';
  var phone = ($('fPhone') && $('fPhone').value.trim()) || '';
  var bank = ($('fBank') && $('fBank').value.trim()) || '';
  var accNum = ($('fAccNum') && $('fAccNum').value.trim()) || '';
  var holder = ($('fHolder') && $('fHolder').value.trim()) || '';
  var nickname = ($('fNick') && $('fNick').value.trim()) || '';

  var problems = [];
  if (f.lock || f.ocrBusy) problems.push('사진을 아직 처리 중입니다. 잠깐만 기다려 주세요.');
  if (f.dup && f.dup.allowed === false) problems.push(f.dup.message);
  if (!account) problems.push('구매 계정을 넣어 주세요.');
  if (!f.order) problems.push('주문 캡처 사진을 넣어 주세요.');
  if (!orderNo) problems.push('주문번호를 넣어 주세요.');
  if (!address) problems.push('배송지 주소를 넣어 주세요.');
  if (!accNum) problems.push('정산받을 계좌번호를 넣어 주세요.');
  if (problems.length) {
    $('submitBox').innerHTML = '<div class="msg err">' + problems.map(esc).join('<br>') + '</div>';
    return;
  }

  f.busy = true;
  var btn = $('submitBtn');
  btn.disabled = true;
  btn.textContent = '제출 중…';
  $('submitBox').innerHTML = '<div class="prog"><span class="spin"></span>정원·중복 확인 → 캡처 저장 → 기록 중…</div>';

  var payload = {
    campaignId: f.campaignId,
    account: account,
    orderNo: orderNo,
    amount: amount,
    name: state.me ? state.me.name : receiver,
    pin: state.me ? state.me.pin : phone.replace(/[^0-9]/g, '').slice(-8),
    phone: phone,
    nickname: nickname,
    orderCapture: { base64: f.order.base64, mimeType: f.order.mimeType, name: 'order' },
    reviewCapture: f.review ? { base64: f.review.base64, mimeType: f.review.mimeType, name: 'review' } : null,
    profile: {
      name: state.me ? state.me.name : receiver,
      receiver: receiver,
      address: address,
      phone: phone,
      bank: bank,
      account: accNum,
      holder: holder || receiver,
      nickname: nickname,
      accounts: (state.profile && state.profile.accounts) ? state.profile.accounts : {}
    }
  };

  call('submitReview', payload).then(function(res){
    f.busy = false;
    if (!res || !res.ok) {
      btn.disabled = false;
      btn.textContent = '제출하기';
      var msg = (res && res.message) || '제출하지 못했습니다.';
      $('submitBox').innerHTML = '<div class="msg err">' + esc(msg) + '</div>';
      if (res && (res.code === 'SANGJUNG' || res.code === 'SEUNGJUNG')) {
        state.form.dup = { allowed: false, message: msg, label: res.label };
      }
      return;
    }
    // 성공
    state.profile = {
      name: payload.name, phone: phone, receiver: receiver, address: address,
      bank: bank, account: accNum, holder: holder || receiver, nickname: nickname,
      accounts: payload.profile.accounts
    };
    var html = '';
    html += '<div style="text-align:center;padding:14px 0 6px"><div style="font-size:38px">✅</div>' +
            '<h3 style="margin:8px 0 4px">제출 완료</h3>' +
            '<p class="hint" style="margin:0">제출번호 <b>' + esc(res.submissionId) + '</b></p></div>';
    html += '<div class="kv">' +
      '<div><span>상품</span><b>' + esc(res.product || '') + '</b></div>' +
      '<div><span>주문번호</span><b>' + esc(orderNo) + '</b></div>' +
      '<div><span>남은 자리</span><b>' + res.remain + '명</b></div>' +
      '<div><span>정산</span><b>리뷰 승인 후 지급</b></div>' +
      '</div>';
    if (res.orderCaptureUrl) html += '<a class="btn wide" href="' + esc(res.orderCaptureUrl) + '" target="_blank" rel="noopener">내 캡처 보기 ↗</a>';
    html += '<div style="height:8px"></div><button class="btn primary wide" data-act="close">확인</button>';
    html += '<p class="hint">리뷰는 작성한 뒤 <b>내 제출 내역</b>에서 캡처만 올릴 수 있어요.</p>';
    openSheet('제출 완료', html);
    renderMe();
    loadCampaigns(true);
    loadMySubmissions();
  }).catch(function(err){
    f.busy = false;
    btn.disabled = false;
    btn.textContent = '제출하기';
    $('submitBox').innerHTML = '<div class="msg err">' + esc(err.message || '제출 실패') + '</div>';
  });
}

function loadMySubmissions(){
  if (!state.me) return;
  call('getMySubmissions', state.me.name, state.me.pin).then(function(res){
    var box = $('mySubs');
    if (!res || !res.ok || !res.submissions || !res.submissions.length) {
      box.innerHTML = '<div class="empty">아직 제출 내역이 없습니다.</div>';
      return;
    }
    state.submissions = res.submissions;
    box.innerHTML = res.submissions.map(function(s){
      var chip = s.status === '승인' ? '<span class="st ok">승인</span>'
        : (s.status === '반려' ? '<span class="st no">반려</span>' : '<span class="st wait">검수중</span>');
      var links = '';
      if (s.orderUrl) links += '<a class="btn sm" href="' + esc(s.orderUrl) + '" target="_blank" rel="noopener">주문 캡처</a>';
      if (s.reviewUrl) links += '<a class="btn sm" href="' + esc(s.reviewUrl) + '" target="_blank" rel="noopener">리뷰 캡처</a>';
      if (!s.reviewUrl && s.status !== '반려') links += '<button class="btn sm" data-act="upreview" data-id="' + esc(s.id) + '">리뷰 캡처 올리기</button>';
      return '<div class="sub-item"><div class="t"><div><div class="p">' + esc(s.product) + '</div>' +
        '<div class="d"><span>' + esc(String(s.submittedAt).substring(0, 16)) + '</span><span>주문 ' + esc(s.orderNo) + '</span><span>' + won(s.payout || (s.amount + s.reviewFee)) + '원 지급</span></div></div>' + chip + '</div>' +
        (links ? '<div class="links">' + links + '</div>' : '') + '</div>';
    }).join('');
  }).catch(function(){
    $('mySubs').innerHTML = '<div class="empty">내역을 불러오지 못했습니다.</div>';
  });
}

function clientError(msg){
  $('cvBody').innerHTML = '<div class="card" style="text-align:center;padding:28px 18px">' +
    '<div style="font-size:30px;margin-bottom:8px">🔒</div>' +

}

function loadClient(){

function statusChip(st){

function shortTime(v){

}

        if (r.orderUrl) cap += '<a href="' + esc(r.orderUrl) + '" target="_blank" rel="noopener">주문</a> ';

/* ══════════════════════════════════════════════════════════════
   입력 자동완성 — '쿠'만 쳐도 '쿠팡'이 뜨고, 엔터·탭 한 번에 채워진다.
   iOS 사파리는 한글 조합 중에 datalist를 잘 못 띄우므로 직접 그린다.
   ══════════════════════════════════════════════════════════════ */
var AC_PLATFORMS = ['쿠팡', '네이버', '올리브영', '오늘의집', '11번가', 'G마켓', '카카오선물하기'];
var AC_JAMO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';

function acPlatformChips(){
  var seen = {}, out = [];
  function add(v){ v = String(v == null ? '' : v).trim(); if (!v || seen[v]) return; seen[v] = 1; out.push(v); }
  AC_PLATFORMS.forEach(add);
  var d = state.admin;
  if (d && d.campaigns) d.campaigns.slice().reverse().forEach(function(c){ if (out.length < 8) add(c.platform); });
  return out.map(function(v){
    return '<button type="button" data-act="ac" data-tgt="ncPlatform" data-val="' + esc(v) + '">' + esc(v) + '</button>';
  }).join('');
}

/* 후보 목록: 기본 목록 → 기존 캠페인에 쓴 값(최근 것부터) */
function acPool(kind){
  var seen = {}, out = [];
  function add(v){ v = String(v == null ? '' : v).trim(); if (!v || seen[v.toLowerCase()]) return; seen[v.toLowerCase()] = 1; out.push(v); }
  var d = state.admin;
  var list = (d && d.campaigns) ? d.campaigns.slice().reverse() : [];
  if (kind === 'store') {
    var plat = ($('ncPlatform') || {}).value || '';
    /* 같은 플랫폼에서 썼던 스토어명을 먼저 */
    if (plat) list.forEach(function(c){ if (String(c.platform || '').trim() === plat) add(c.store); });
    list.forEach(function(c){ add(c.store); });
    AC_PLATFORMS.forEach(add);
  } else {
    AC_PLATFORMS.forEach(add);
    list.forEach(function(c){ add(c.platform); });
  }
  return out;
}

/* 앞에서부터 일치 > 중간 일치 > 초성만 일치('ㅋ'→'쿠팡') */
function acScore(v, q){
  if (!q) return { r: 2, i: -1 };
  var lv = v.toLowerCase(), lq = q.toLowerCase();
  var i = lv.indexOf(lq);
  if (i === 0) return { r: 0, i: 0 };
  if (i > 0) return { r: 1, i: i };
  if (q.length === 1) {
    var ji = AC_JAMO.indexOf(q), c0 = v.charCodeAt(0);
    if (ji >= 0 && c0 >= 0xAC00 && c0 <= 0xD7A3 && Math.floor((c0 - 0xAC00) / 588) === ji) return { r: 0, i: -1 };
  }
  return null;
}

function acHl(v, q){
  if (!q) return esc(v);
  var i = v.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(v);
  return esc(v.substring(0, i)) + '<em>' + esc(v.substring(i, i + q.length)) + '</em>' + esc(v.substring(i + q.length));
}

function acChipSync(inputId, val){
  var strip = document.querySelector('[data-chips="' + inputId + '"]');
  if (!strip) return;
  Array.prototype.forEach.call(strip.querySelectorAll('[data-val]'), function(b){
    if (b.getAttribute('data-val') === val) b.classList.add('on'); else b.classList.remove('on');
  });
}

function acInit(inp){
  var kind = inp.getAttribute('data-ac');
  var box = document.getElementById(inp.id + 'List');
  if (!box) return;
  var items = [], cur = -1;

  function hide(){ box.classList.remove('on'); box.innerHTML = ''; items = []; cur = -1; }
  function mark(){
    Array.prototype.forEach.call(box.children, function(b, i){ if (i === cur) b.classList.add('on'); else b.classList.remove('on'); });
  }
  function fill(v){
    if (v == null) return;
    inp.value = v;
    hide();
    acChipSync(inp.id, v);
  }
  function render(){
    var q = String(inp.value || '').trim();
    acChipSync(inp.id, q);
    var pool = acPool(kind), scored = [];
    pool.forEach(function(v, o){
      if (v.toLowerCase() === q.toLowerCase()) return;   /* 이미 같은 값이면 후보에서 뺱 */
      var s = acScore(v, q);
      if (s) scored.push({ v: v, r: s.r, i: s.i, o: o });
    });
    scored.sort(function(a, b){ return a.r - b.r || a.o - b.o; });
    items = scored.slice(0, 6).map(function(x){ return x.v; });
    cur = items.length ? 0 : -1;
    if (!items.length) { hide(); return; }
    box.innerHTML = items.map(function(v, i){
      return '<button type="button" class="ac-item' + (i === 0 ? ' on' : '') + '" data-v="' + esc(v) + '">' +
        '<span>' + acHl(v, q) + '</span></button>';
    }).join('');
    box.classList.add('on');
  }

  inp.addEventListener('focus', render);
  inp.addEventListener('click', render);
  inp.addEventListener('input', render);
  inp.addEventListener('compositionend', function(){ setTimeout(render, 0); });
  inp.addEventListener('keydown', function(e){
    if (!items.length) return;
    if (e.key === 'Enter') { e.preventDefault(); fill(items[cur < 0 ? 0 : cur]); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      cur = (cur + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      mark();
    }
    if (e.key === 'Escape') hide();
  });
  inp.addEventListener('blur', function(){ setTimeout(hide, 200); });
  /* 아이폰은 탭하는 순간 입력칸이 blur돼 목록이 먼저 닫히므로 pointerdown에서 바로 채운다 */
  box.addEventListener('pointerdown', function(e){
    var b = e.target.closest('[data-v]');
    if (!b) return;
    e.preventDefault();
    fill(b.getAttribute('data-v'));
  });
}

function acBindAll(root){
  Array.prototype.forEach.call((root || document).querySelectorAll('input[data-ac]'), function(inp){
    if (inp.getAttribute('data-ac-bound') === '1') return;
    inp.setAttribute('data-ac-bound', '1');
    acInit(inp);
  });
}

function subCard(s, showActions){
  var chip = s.status === '승인' ? '<span class="st ok">승인</span>'
    : (s.status === '반려' ? '<span class="st no">반려</span>' : '<span class="st wait">검수중</span>');
  var links = '';
  if (s.orderUrl) links += '<a class="btn sm" href="' + esc(s.orderUrl) + '" target="_blank" rel="noopener">주문 캡처</a>';
  if (s.reviewUrl) links += '<a class="btn sm" href="' + esc(s.reviewUrl) + '" target="_blank" rel="noopener">리뷰 캡처</a>';
  var actions = '';
  if (showActions && s.status === '제출') {
    actions = '<div class="row" style="margin-top:8px">' +
      '<button class="btn sm ok" data-act="approve" data-id="' + esc(s.id) + '">승인</button>' +
      '<button class="btn sm bad" data-act="reject" data-id="' + esc(s.id) + '">반려</button></div>';
  }
  return '<div class="ad-card"><div class="h"><div style="min-width:0">' +
    '<div class="tiny">' + esc(s.id) + ' · ' + esc(String(s.submittedAt).substring(0, 16)) + '</div>' +
    '<div style="font-weight:700;font-size:13.5px;margin:2px 0 3px;word-break:keep-all">' + esc(s.product) + '</div>' +
    '<div class="tiny"><b>' + esc(s.name) + '</b> · ' + esc(s.phone || '-') + ' · 계정 ' + esc(s.account) + '</div>' +
    '<div class="tiny">주문 ' + esc(s.orderNo) + ' · 결제(페이백) ' + won(s.amount) + '원 · 리뷰비 ' + won(s.reviewFee) +
      ' · 실지급 ' + won(s.payout || (s.amount + s.reviewFee)) + '원</div>' +
    '</div>' + chip + '</div>' +
    (links ? '<div class="links" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' + links + '</div>' : '') +
    actions + '</div>';
}

function adminReview(d){
  var pending = d.submissions.filter(function(s){ return s.status === '제출'; });
  if (!pending.length) return '<div class="empty"><b>검수할 제출이 없습니다</b>새 제출이 들어오면 여기에 표시됩니다.</div>';

    pending.map(function(s){ return subCard(s, true); }).join('');
}

function adminAll(d){
  var f = state.filter;
  var list = d.submissions.filter(function(s){
    if (f === 'all') return true;
    if (f === 'wait') return s.status === '제출';
    if (f === 'ok') return s.status === '승인';
    if (f === 'no') return s.status === '반려';
    return true;
  });
  var seg = [['all','전체'],['wait','검수중'],['ok','승인'],['no','반려']].map(function(x){
    return '<button class="' + (f === x[0] ? 'on' : '') + '" data-act="filter" data-f="' + x[0] + '">' + x[1] + '</button>';
  }).join('');
  return '<div class="seg">' + seg + '</div>' +
    (list.length ? list.map(function(s){ return subCard(s, s.status === '제출'); }).join('') : '<div class="empty">해당 건이 없습니다.</div>');
}

/* ── 액션 처리 (이벤트 위임) ──────────────────────────── */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');

  if (act === 'close') { closeSheet(); return; }
  if (act === 'ac') {
    var acT = $(el.getAttribute('data-tgt') || ''), acV = el.getAttribute('data-val') || '';
    if (acT) {
      acT.value = acV;
      acChipSync(acT.id, acV);
      var acL = document.getElementById(acT.id + 'List');
      if (acL) { acL.classList.remove('on'); acL.innerHTML = ''; }
    }
    return;
  }
  if (act === 'logout') { logout(); return; }
  if (act === 'copy') { copyText(el.getAttribute('data-text') || ''); return; }
  if (act === 'detail') { openDetail(el.getAttribute('data-id')); return; }
  if (act === 'goform') { openForm(el.getAttribute('data-id')); return; }
  if (act === 'submit') { doSubmit(); return; }
  if (act === 'delcap') {
    var kind = el.getAttribute('data-kind');
    if (state.form) state.form[kind] = null;
    $(kind === 'order' ? 'orderPreview' : 'reviewPreview').innerHTML = '';
    if (kind === 'order') $('ocrBox').innerHTML = '';
    return;
  }
  if (act === 'upreview') {
    var sid = el.getAttribute('data-id');
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', function(){
      var file = inp.files && inp.files[0];
      document.body.removeChild(inp);
      if (!file) return;
      el.disabled = true;
      var prev = el.textContent;
      el.textContent = '올리는 중…';
      imgFromFile(file, 1500, 0.72).then(function(img){
        return call('attachReview', sid, state.me.name, state.me.pin, { base64: img.base64, mimeType: img.mimeType, name: 'review' });
      }).then(function(res){
        if (res && res.ok) { toast('리뷰 캡처를 올렸습니다'); loadMySubmissions(); }
        else { el.disabled = false; el.textContent = prev; toast((res && res.message) || '올리지 못했습니다'); }
      }).catch(function(err){
        el.disabled = false; el.textContent = prev;
        toast(err.message || '올리지 못했습니다');
      });
    });
    inp.click();
    return;
  }
  if (act === 'filter') { state.filter = el.getAttribute('data-f'); renderAdminBody(); return; }
  if (act === 'copyClient') {
    var url = el.getAttribute('data-url') || '';
    if (!url) { toast('링크를 만들지 못했습니다'); return; }
    if (url.charAt(0) === '?') url = BASE_DIR + url;
    copyText(url, '업체 링크를 복사했어요 — 카톡방에 붙여넣으세요');
    return;
  }
  if (act === 'cvRefresh') { loadClient(); return; }

  if (act === 'createCampaign') {
    var payload = {
      platform: ($('ncPlatform') || {}).value || '',
      store: ($('ncStore') || {}).value || '',
      product: ($('ncProduct') || {}).value || '',
      productKey: ($('ncKey') || {}).value || '',
      quota: ($('ncQuota') || {}).value || '',
      payback: ($('ncPayback') || {}).value || '',
      reviewFee: ($('ncReviewFee') || {}).value || '',
      agencyFee: ($('ncAgencyFee') || {}).value || '',
      taxInvoice: ($('ncTax') || {}).value || '',
      deposit: ($('ncDeposit') || {}).value || '',
      startDate: ($('ncStart') || {}).value || '',
      endDate: ($('ncEnd') || {}).value || '',
      link: ($('ncLink') || {}).value || '',
      guide: ($('ncGuide') || {}).value || '',
      note: ($('ncNote') || {}).value || ''
    };
    el.disabled = true; el.textContent = '등록 중…';
    call('createCampaign', state.adminPin, payload).then(function(res){
      el.disabled = false; el.textContent = '캠페인 등록';
      if (!res || !res.ok) { $('ncMsg').innerHTML = '<div class="msg err">' + esc((res && res.message) || '실패') + '</div>'; return; }
      toast(res.message || '등록 완료');
      loadAdmin();
    }).catch(function(err){
      el.disabled = false; el.textContent = '캠페인 등록';
      $('ncMsg').innerHTML = '<div class="msg err">' + esc(err.message || '실패') + '</div>';
    });
    return;
  }
  if (act === 'toggleCampaign') {
    el.disabled = true;
    call('toggleCampaign', state.adminPin, el.getAttribute('data-id'), '').then(function(res){
      if (!res || !res.ok) { el.disabled = false; toast((res && res.message) || '실패'); return; }
      toast(res.status + '로 바꿨습니다');
      loadAdmin();
    }).catch(function(){ el.disabled = false; toast('실패'); });
    return;
  }
  if (act === 'approve' || act === 'reject') {
    var dec = act === 'approve' ? '승인' : '반려';
    el.disabled = true;
    call('reviewDecision', state.adminPin, el.getAttribute('data-id'), dec, '').then(function(res){
      if (!res || !res.ok) { el.disabled = false; toast((res && res.message) || '실패'); return; }
      toast(dec + ' 처리했습니다');
      loadAdmin();
    }).catch(function(){ el.disabled = false; toast('실패'); });
    return;
  }
  if (act === 'createSettlement') {
    el.disabled = true; el.textContent = '생성 중…';
    call('createSettlement', state.adminPin, ($('stDate') || {}).value || '').then(function(res){
      el.disabled = false; el.textContent = '정산 생성';
      if (!res || !res.ok) { $('stMsg').innerHTML = '<div class="msg err">' + esc((res && res.message) || '실패') + '</div>'; return; }
      toast(res.message || '정산 생성 완료');
      loadAdmin();
    }).catch(function(err){
      el.disabled = false; el.textContent = '정산 생성';
      $('stMsg').innerHTML = '<div class="msg err">' + esc(err.message || '실패') + '</div>';
    });
    return;
  }
  if (act === 'transfer') {
    el.disabled = true;
    call('updateTransferState', state.adminPin, el.getAttribute('data-id'), el.getAttribute('data-state')).then(function(res){
      if (!res || !res.ok) { el.disabled = false; toast((res && res.message) || '실패'); return; }
      toast('이체 상태를 바꿨습니다');
      loadAdmin();
    }).catch(function(){ el.disabled = false; toast('실패'); });
    return;
  }
});
