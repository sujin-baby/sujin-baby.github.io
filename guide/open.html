<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사파리에서 상품 열기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #1e293b; text-align: center; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 24px; border-radius: 18px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); max-width: 340px; width: 100%; border: 1.5px solid #e2e8f0; }
    h2 { font-size: 18px; margin: 0 0 10px; color: #5b2a86; }
    p { font-size: 14px; color: #64748b; line-height: 1.5; margin: 0 0 16px; }
    .btn { display: block; background: linear-gradient(135deg, #6366f1, #4f46e5); color: white; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 16px; box-shadow: 0 4px 12px rgba(79,70,229,0.25); }
    .btn:active { transform: scale(0.98); }
    .tip { font-size: 12px; color: #94a3b8; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📱 사파리 전용 상품 열기</h2>
    <p>쿠팡 앱으로 튕기지 않고<br>사파리 브라우저에서 바로 열려요.</p>
    <a id="go" class="btn" href="#">상품 페이지로 이동</a>
    <div class="tip">💡 열린 후 주소창/북마크에서 위치 찾기를 실행하세요</div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    const target = qs.get("url");
    if (target) {
      document.getElementById("go").href = target;
      // location.replace from user gesture or after tiny delay prevents iOS Universal Link app intercept
      setTimeout(() => {
        location.replace(target);
      }, 400);
    }
  </script>
</body>
</html>
