<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>사파리에서 상품 열기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fff5f8; color: #3a2230; text-align: center; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 24px 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(255,95,168,0.15); max-width: 360px; width: 100%; border: 2.5px solid #3a2230; }
    h2 { font-size: 19px; margin: 0 0 12px; color: #ff5fa8; }
    .status { background: #e8f9f0; color: #0b7a42; border: 1.5px solid #0b7a42; border-radius: 10px; padding: 10px; font-weight: bold; font-size: 14px; margin-bottom: 16px; }
    .guide-box { background: #fdf2f6; border: 1.5px solid #3a2230; border-radius: 12px; padding: 14px; text-align: left; font-size: 13px; line-height: 1.6; color: #3a2230; margin-bottom: 16px; }
    .guide-box b { color: #d63384; }
    .btn { display: block; background: #ff5fa8; color: white; padding: 13px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 15px; border: 2px solid #3a2230; box-shadow: 2px 2px 0 #3a2230; cursor: pointer; margin-bottom: 10px; }
    .btn.sub { background: #fff; color: #3a2230; font-size: 13px; padding: 10px; }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #3a2230; }
    .tip { font-size: 11.5px; color: #8c7280; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📱 쿠팡 상품 페이지 열기</h2>
    <div class="status" id="cp-st">✓ 상품 주소 준비 완료</div>
    
    <a id="go" class="btn" href="#" target="_blank" rel="noopener">👉 상품 페이지 바로 열기</a>
    
    <div class="guide-box" style="margin-top:16px;">
      <b>⚠️ 주소창 [붙여넣기 및 이동] 금지</b><br>
      사파리 주소창에 단축링크를 직접 붙여넣으면 쿠팡 보안 방화벽이 차단하여 <b>'사용권한이 없습니다'</b> 오류가 뜹니다.<br><br>
      <b>💡 사파리 웹에서 바로 여는 법:</b><br>
      위 <b>[👉 상품 페이지 바로 열기]</b> 버튼을 <b>손가락으로 꾹 길게 눌러</b> 나오는 메뉴에서 <b>[새 탭에서 열기]</b>를 누르시면 앱으로 튕기지 않고 사파리에서 바로 열립니다!
    </div>
    
    <button type="button" class="btn sub" id="copy-btn">📋 원본 주소 복사하기</button>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    let target = qs.get("url") || "";
    if (/link\.coupang\.com|coupa\.ng/.test(target)) {
      target = target.replace(/#(kw|pr|fn)=.*$/, "");
    }
    if (target) {
      document.getElementById("go").href = target;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(target).catch(() => {});
      }
    }
    document.getElementById("copy-btn").addEventListener("click", () => {
      if (target) {
        navigator.clipboard.writeText(target).then(() => {
          document.getElementById("cp-st").textContent = "✓ 주소를 다시 복사했어요!";
        }).catch(() => {
          prompt("아래 주소를 복사해 주세요:", target);
        });
      }
    });
  </script>
</body>
</html>
