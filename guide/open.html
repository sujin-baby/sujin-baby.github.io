<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>사파리에서 상품 열기</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #fff5f8; color: #3a2230; text-align: center; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 24px 20px; border-radius: 20px; box-shadow: 0 6px 20px rgba(255,95,168,0.15); max-width: 360px; width: 100%; border: 2.5px solid #3a2230; box-sizing: border-box; }
    h2 { font-size: 19px; margin: 0 0 12px; color: #ff5fa8; }
    .status { background: #e8f9f0; color: #0b7a42; border: 1.5px solid #0b7a42; border-radius: 10px; padding: 10px; font-weight: bold; font-size: 13.5px; margin-bottom: 14px; word-break: keep-all; }
    .kw-card { background: #f0f7ff; border: 1.5px solid #3182f6; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; text-align: left; }
    .kw-badge { font-size: 11px; font-weight: bold; color: #1971c2; text-transform: uppercase; margin-bottom: 2px; }
    .kw-val { font-size: 16px; font-weight: 800; color: #0c4a6e; word-break: break-all; }
    .guide-box { background: #fdf2f6; border: 1.5px solid #3a2230; border-radius: 12px; padding: 14px; text-align: left; font-size: 13px; line-height: 1.6; color: #3a2230; margin-bottom: 16px; }
    .guide-box b { color: #d63384; }
    .guide-steps { margin: 8px 0 0; padding-left: 18px; }
    .guide-steps li { margin-bottom: 6px; }
    .btn { display: block; width: 100%; box-sizing: border-box; background: #ff5fa8; color: white; padding: 13px; border-radius: 12px; text-decoration: none; font-weight: 900; font-size: 15px; border: 2px solid #3a2230; box-shadow: 2px 2px 0 #3a2230; cursor: pointer; margin-bottom: 10px; text-align: center; }
    .btn.sub { background: #fff; color: #3a2230; font-size: 13px; padding: 10px; }
    .btn.ghost { background: #f8f9fa; color: #6c757d; font-size: 12px; padding: 8px; border-color: #adb5bd; box-shadow: none; }
    .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #3a2230; }
  </style>
</head>
<body>
  <div class="card">
    <h2>📱 쿠팡 상품 위치 찾기</h2>
    <div class="status" id="cp-st">✓ 상품 주소 준비 완료</div>

    <div class="kw-card" id="kw-card" style="display:none;">
      <div class="kw-badge">🔑 의뢰서 검색 키워드</div>
      <div class="kw-val" id="kw-val"></div>
    </div>

    <button type="button" class="btn" id="copy-safari-btn">📋 사파리 주소 복사하기 (키워드 포함)</button>
    <button type="button" class="btn sub" id="copy-kw-btn" style="display:none;">🔑 키워드만 복사하기</button>

    <div class="guide-box">
      <b>💡 아이폰 사파리에서 위치 찾는 방법:</b>
      <div style="font-size:12px; color:#666; margin:4px 0 8px;">쿠팡 보안 정책(외부 링크 403 차단) 때문에 링크를 직접 누르면 열리지 않습니다. 아래 순서대로 해 주세요:</div>
      <ol class="guide-steps">
        <li>위 <b>[📋 사파리 주소 복사하기]</b> 탭 (페이지 열릴 때 이미 복사됨)</li>
        <li>사파리 <b>주소창 탭 → [붙여넣기 및 이동]</b></li>
        <li>상품 화면이 열리면 <b>[북마크 상품위치 찾기]</b> 탭!</li>
      </ol>
      <div style="font-size:11.5px; color:#d63384; margin-top:8px;">👉 복사된 주소에 의뢰서 키워드가 포함되어 있어 북마크가 정확한 키워드로 위치를 100% 찾아줍니다.</div>
    </div>
  </div>
  <script>
    const qs = new URLSearchParams(location.search);
    let target = qs.get("url") || "";
    let rawKw = (qs.get("kw") || (target.match(/[#&]kw=([^&]+)/) || [])[1] || "").trim();
    let kw = rawKw;
    if (kw) {
      try { kw = decodeURIComponent(kw); } catch (e) {}
    }
    // 옵션명이나 복수 키워드가 넘어오더라도 대표 키워드만 단일 추출
    const k0 = kw.split("|")[0].trim();
    const pr = qs.get("pr") || (target.match(/[#&]pr=([^&]+)/) || [])[1] || "";
    const fn = qs.get("fn") || (target.match(/[#&]fn=([^&]+)/) || [])[1] || "";

    function toMobileCp(u) {
      if (!u) return u;
      const pk = (u.match(/[?&]pageKey=(\d+)/) || [])[1];
      if (pk) {
        const item = (u.match(/[?&]itemId=(\d+)/) || [])[1];
        const vendor = (u.match(/[?&]vendorItemId=(\d+)/) || [])[1];
        let res = "https://m.coupang.com/vm/products/" + pk;
        const q = [];
        if (item) q.push("itemId=" + item);
        if (vendor) q.push("vendorItemId=" + vendor);
        if (q.length) res += "?" + q.join("&");
        return res;
      }
      return u.replace(/https?:\/\/(?:www\.)?coupang\.com\/vp\/products\/(\d+)/, "https://m.coupang.com/vm/products/$1");
    }
    function buildTargetUrl(base, k, p, f) {
      if (!base) return base;
      let res = toMobileCp(base.replace(/#(kw|pr|fn)=.*$/, ""));
      const sep = res.indexOf("?") === -1 ? "?" : "&";
      if (k && !/[?&]kw=/.test(res)) res += sep + "kw=" + encodeURIComponent(k);
      if (p && !/[?&]pr=/.test(res)) res += "&pr=" + p;
      if (f && !/[?&]fn=/.test(res)) res += "&fn=" + encodeURIComponent(f);
      const h = [];
      if (k) h.push("kw=" + encodeURIComponent(k));
      if (p) h.push("pr=" + p);
      if (f) h.push("fn=" + encodeURIComponent(f));
      if (h.length && res.indexOf("#") === -1) res += "#" + h.join("&");
      return res;
    }
    const cleanTarget = toMobileCp(target.replace(/#(kw|pr|fn)=.*$/, ""));
    const fullTarget = buildTargetUrl(cleanTarget, k0, pr, fn);

    const kwCard = document.getElementById("kw-card");
    const kwVal = document.getElementById("kw-val");
    const copyKwBtn = document.getElementById("copy-kw-btn");
    const cpSt = document.getElementById("cp-st");
    const copySafariBtn = document.getElementById("copy-safari-btn");

    if (k0) {
      kwCard.style.display = "block";
      kwVal.textContent = k0;
      copyKwBtn.style.display = "block";
      copyKwBtn.textContent = '🔑 키워드만 복사 ("' + k0 + '")';
    }

    // 진입 시 자동으로 키워드가 포함된 주소를 클립보드에 복사해 둠
    if (fullTarget && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(fullTarget).then(() => {
        cpSt.textContent = "✓ 주소(키워드 포함) 자동 복사 완료";
      }).catch(() => {});
    }

    copySafariBtn.addEventListener("click", () => {
      const toCopy = fullTarget || cleanTarget;
      if (!toCopy) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(toCopy).then(() => {
          cpSt.textContent = "✓ 주소를 복사했어요! 사파리 주소창에 붙여넣기 하세요";
        }).catch(() => {
          prompt("아래 주소를 복사해 주세요:", toCopy);
        });
      } else {
        prompt("아래 주소를 복사해 주세요:", toCopy);
      }
    });

    copyKwBtn.addEventListener("click", () => {
      const k0 = kw.split("|")[0];
      if (!k0) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(k0).then(() => {
          cpSt.textContent = '✓ 키워드 "' + k0 + '" 복사 완료';
        }).catch(() => {
          prompt("키워드를 복사해 주세요:", k0);
        });
      } else {
        prompt("키워드를 복사해 주세요:", k0);
      }
    });
  </script>
</body>
</html>
