<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff8fc0"><meta name="description" content="아기 정보만 입력하면 오늘 먹일 것부터 다음 새 재료까지 챙겨주는 이유식 관리 앱"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="이유식공장"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>우리 아기 이유식공장👶🏻</title>
<link id="app-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style id="app-style">/* 이유식공장 · 모바일 앱 레이아웃: 상단 앱바 → 한 화면씩(홈·식단표·알러지·직원·기록) → 하단 탭바. 컴퓨터에서는 가운데 폰 폭 기둥 */
:root{
  --pink:#ff8fc0; --pink-deep:#ff5fa8; --pink-bg:#ffe6f2; --pink-line:#ffc6e0;
  --ink:#4a2b3c; --ink-soft:#8a6076; --ink-faint:#b98aa4;
  --lav:#c9b8ff; --lav-bg:#efe8ff; --mint:#b8f0dd; --yellow:#fff3b0; --peach:#ffd8a8;
  --win:#ffffff; --tint:#fff6fa; --alert:#e8475f; --alert-bg:#ffe4e9; --ok:#2f9e6e; --warn-bg:#fffbe6; --warn-line:#f0d67a;
  --f-display:"Archivo","Noto Sans KR",sans-serif;
  --f-body:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  --tab-h:64px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--pink-bg)}
body{margin:0;background-color:var(--pink-bg);background-image:radial-gradient(var(--pink-line) 1.2px,transparent 1.2px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,95,168,.45);outline-offset:2px}
h1,h2,h3,p{margin:0;word-break:keep-all}
.tiny{font-size:12px;color:var(--ink-soft)}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:rgba(255,246,250,.55);border-inline:2px solid var(--ink);position:relative}
@media (max-width:600px){.app{border-inline:0;background:transparent}}

/* 앱바 */
.appbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(90deg,var(--pink),var(--lav));border-bottom:2px solid var(--ink)}
.appbar-in{display:flex;align-items:center;gap:8px;padding:10px 16px;min-height:56px}
.brand{display:grid;min-width:0;flex:1}
.brand b{color:var(--win);font-size:18px;font-weight:900;letter-spacing:-.3px;text-shadow:0 1px rgba(74,43,60,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:rgba(255,255,255,.9);font-size:11px;font-weight:700}
.dchip{flex:none;padding:5px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);font:900 13px var(--f-display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 9px;border:1.5px solid var(--ink);border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap;background:var(--win)}
.pill.work{background:var(--mint)}.pill.alert{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}.pill.wait{background:var(--yellow)}.pill.off{background:#f3e9ef;color:var(--ink-soft)}

/* 화면 */
.screens{padding:14px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
.screen{display:grid;gap:14px}
.card{border:2px solid var(--ink);border-radius:18px;background:var(--win);padding:14px;box-shadow:4px 4px 0 rgba(255,95,168,.22);min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{font-size:17px;font-weight:900}
.brief-date{font:900 12px var(--f-display);color:var(--pink-deep);letter-spacing:.04em}
.foot{text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.6;padding:4px 8px}

/* 홈 히어로 */
.hero-card{border:2px solid var(--ink);border-radius:20px;background:linear-gradient(160deg,#fff 0%,#fff6fb 60%,#f3edff 100%);padding:16px;box-shadow:4px 4px 0 rgba(255,95,168,.22);display:grid;gap:12px}
.hero-top{display:flex;gap:12px;align-items:center}
.hero-top b{display:block;font-size:17px;font-weight:900}
.hero-top small{display:block;font-size:12.5px;color:var(--ink-soft)}
.ava{flex:none;width:42px;height:42px;border-radius:12px;border:2px solid var(--ink);display:grid;place-items:center;font:900 14px var(--f-body);position:relative}
.ava.big{width:52px;height:52px;border-radius:16px;font-size:18px}
.ava::after{content:"";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--win);background:var(--st,var(--ink-faint))}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.metric{display:grid;gap:2px;padding:10px 12px;border:2px solid var(--ink);border-radius:14px;min-width:0}
.metric span{font-size:11.5px;font-weight:900}
.metric strong{font:900 24px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.metric strong em{font-style:normal;font-size:13px;margin-left:2px}
.metric small{color:var(--ink-soft);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.metric:last-child{grid-column:1 / -1}
.m-yellow{background:var(--yellow)}.m-mint{background:var(--mint)}.m-pink{background:#ffd6e8}.m-lav{background:var(--lav-bg)}.m-white{background:var(--win)}

/* 오늘 식단 */
.meal{display:grid;gap:7px}
.meal-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;padding:10px 12px;border:1.5px solid var(--pink-line);border-radius:12px;background:var(--tint)}
.meal-row span{font-weight:900;font-size:12px;padding-top:2px;color:var(--ink-soft)}
.meal-row p{white-space:pre-line;font-weight:700}
.meal-row.new{border-color:var(--ink)}
.meal-row.al{background:var(--alert-bg);border-color:var(--alert)}.meal-row.al p{color:var(--alert)}
.empty{padding:16px;border:2px dashed var(--pink-line);border-radius:14px;color:var(--ink-soft);line-height:1.6;text-align:center;font-size:13.5px}

/* 타임라인 */
.timeline{display:grid}
.tl{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px dashed var(--pink-line)}
.tl:last-child{border-bottom:0}
.tl time{font:700 12.5px var(--f-display);color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:3px}
.tl time.today{color:var(--pink-deep)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:3px 10px;border-radius:8px;border:1.5px solid var(--ink);font-size:13px;font-weight:700;background:var(--win)}
.tag.al{background:var(--alert-bg);border-color:var(--alert);color:var(--alert)}
.tag.memo{border-style:dashed;font-weight:500;color:var(--ink-soft);font-size:12px}

/* 점검 보고 */
.finds{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.finds li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;align-items:start;padding:10px 11px;border:1.5px solid var(--pink-line);border-radius:12px;background:var(--win);font-size:13.5px;line-height:1.55}
.finds .ico{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);font-weight:900;font-size:12px;background:var(--win)}
.finds .ft{white-space:pre-line;overflow-wrap:anywhere;min-width:0}
.finds .mini{grid-column:2;justify-self:start}
.finds .f-ok .ico{background:var(--mint)}
.finds .f-warn{background:var(--warn-bg);border-color:var(--warn-line)}.finds .f-warn .ico{background:var(--yellow)}
.finds .f-bad{background:var(--alert-bg);border-color:var(--alert)}.finds .f-bad .ico{background:var(--alert);color:var(--win);border-color:var(--alert)}
.finds .f-info .ico{background:var(--lav-bg)}
.mini{border:1.5px solid var(--ink);border-radius:8px;background:var(--win);padding:4px 10px;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.who{border:0;background:var(--pink-bg);border-radius:6px;padding:1px 7px;font-weight:900;font-size:12.5px;cursor:pointer;color:var(--pink-deep)}
.plain{white-space:pre-line}

/* 결재함 */
.approvals{display:grid;gap:10px}
.appr{display:grid;gap:8px;padding:12px;border:2px solid var(--ink);border-radius:14px;background:var(--tint)}
.appr-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.appr-fields{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13.5px}
.appr-fields li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.appr-fields li > span{font-weight:900;font-size:11.5px;color:var(--ink-soft);padding-top:2px}
.appr-fields s{color:var(--ink-faint)}
.appr-change{display:grid;gap:4px;font-size:13.5px}
.appr-change .old{color:var(--ink-soft);text-decoration:line-through;overflow-wrap:anywhere}
.appr-change .new{font-weight:700;overflow-wrap:anywhere}
.appr-change .arrow{display:none}
.appr-reason{font-size:12.5px;color:var(--ink-soft);line-height:1.55}

/* 버튼 */
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:10px 16px;border:2px solid var(--ink);border-radius:14px;background:var(--yellow);box-shadow:3px 3px 0 rgba(74,43,60,.2);font-weight:900;cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{min-height:38px;padding:7px 13px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:var(--win)}.btn.mint{background:var(--mint)}.btn.pink{background:#ffd6e8}
.btn.block{width:100%}
.icon-btn{width:42px;height:42px;border:2px solid var(--ink);border-radius:12px;background:var(--win);font-size:22px;font-weight:900;line-height:1;cursor:pointer}
.linkish{border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--ink-soft);font-size:12px;padding:4px 0;justify-self:start}
.edit-only{}
.ro-only{display:none}
.ro .edit-only{display:none!important}
.ro span.ro-only{display:inline}.ro .btn.ro-only{display:inline-flex}

/* 식단표 */
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:64px;border:2px solid var(--ink);border-radius:999px;background:var(--win);padding:8px 12px;font-weight:900;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.weekbar{display:grid;grid-template-columns:42px minmax(0,1fr) 42px auto;gap:8px;align-items:center}
.weekbar b{text-align:center;font:900 14.5px var(--f-display);font-variant-numeric:tabular-nums}
.cal-list{display:grid;gap:10px}
.day-card{display:grid;gap:6px;width:100%;text-align:left;padding:12px;border:2px solid var(--ink);border-radius:16px;background:var(--win);cursor:pointer;box-shadow:3px 3px 0 rgba(255,95,168,.18)}
.day-card:active{transform:translate(2px,2px);box-shadow:none}
.day-card.today{background:#fffbe0;box-shadow:0 0 0 3px var(--yellow),3px 3px 0 rgba(255,95,168,.18)}
.day-card.plan{background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(201,184,255,.18) 10px 12px)}
.dc-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dc-head b{font:900 16px var(--f-display)}
.dc-head small{color:var(--ink-soft);font-size:12px}
.dl-row{display:grid;grid-template-columns:54px minmax(0,1fr);gap:8px;padding:6px 9px;border-radius:9px;background:var(--tint);font-size:14px;line-height:1.45}
.dl-row span{font-weight:900;font-size:11.5px;color:var(--ink-soft);padding-top:2px}
.dl-row p{white-space:pre-line;overflow-wrap:anywhere}
.dl-row.al{background:var(--alert-bg);color:var(--alert);font-weight:700}
.plan-note{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft)}
.plan-note i{width:16px;height:12px;border:1px solid var(--pink-line);background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(201,184,255,.5) 4px 6px)}

/* 입력 */
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:900}
.field input,.field select,.field textarea{display:block;width:100%;min-width:0;max-width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--win);font-size:16px}
.field input[type="date"],.field input[type="time"]{-webkit-appearance:none;appearance:none;min-height:46px;text-align:left;line-height:1.2}
.field input[type="date"]::-webkit-date-and-time-value,.field input[type="time"]::-webkit-date-and-time-value{text-align:left}
.field textarea{min-height:72px;resize:vertical}
.field.wide{grid-column:1 / -1}
.ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ed-total{padding:11px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--mint);font-weight:900;font-size:13.5px}
.set-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.settings summary{cursor:pointer;font-weight:900;font-size:15px;list-style-position:inside}

/* 알러지 */
.logs{display:grid;gap:8px}
.log{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:11px 12px;border:1.5px solid var(--pink-line);border-radius:12px;background:var(--tint)}
.log time{font:700 12.5px var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink-soft);padding-top:2px}
.log .x{border:0;background:none;color:var(--ink-faint);cursor:pointer;font-size:12px;text-decoration:underline}
.sev-약{background:var(--yellow)}.sev-중{background:var(--peach)}.sev-강{background:var(--alert-bg);color:var(--alert);border-color:var(--alert)}
.redflag{padding:13px 14px;border:2px solid var(--alert);border-radius:16px;background:var(--alert-bg);line-height:1.6;font-size:13.5px}
.redflag b{color:var(--alert)}

/* 직원 */
.askbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.askbar input{min-width:0;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:var(--win);font-size:16px}
.chips-q{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips-q::-webkit-scrollbar{display:none}
.chips-q button,.preset{flex:none;border:1.5px solid var(--ink);border-radius:999px;background:var(--win);padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.chips-q button:active,.preset:active{background:var(--yellow)}
.floor{display:grid;gap:12px}
.room{border:2px dashed var(--pink-line);border-radius:16px;background:var(--tint);padding:12px;display:grid;gap:8px}
.room-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.room-label{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1.5px solid var(--ink);border-radius:999px;background:var(--win);font-weight:900;font-size:12.5px}
.room-label i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.room-mission{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.staff{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;padding:10px;border:2px solid var(--ink);border-radius:14px;background:var(--win);box-shadow:3px 3px 0 rgba(74,43,60,.14);text-align:left;cursor:pointer;color:inherit;text-decoration:none}
.staff:active{transform:translate(2px,2px);box-shadow:none}
.staff b{display:block;font-size:14.5px}
.staff small{display:block;font-size:12px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 기록 */
.road{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:baseline;gap:5px;padding:6px 10px;border:1.5px solid var(--ink);border-radius:10px;font-size:13.5px;font-weight:700}
.chip small{font:700 10.5px var(--f-display);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.chip.future{opacity:.6;border-style:dashed}
.chart-wrap{overflow-x:auto}
.chart-wrap svg{display:block;min-width:480px;width:100%;height:auto}
.bars{display:grid;gap:9px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px}
.bar-row .track{height:14px;border:1.5px solid var(--ink);border-radius:999px;background:var(--win);overflow:hidden}
.bar-row .fill{height:100%;background:var(--pink)}
.bar-row b{font-variant-numeric:tabular-nums;text-align:right;font-family:var(--f-display)}
.calc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.calc-out{margin-top:10px;padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--mint);font-weight:900}
.table-wrap{overflow-x:auto;border:2px solid var(--ink);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:12.5px}
th,td{padding:8px 9px;border-bottom:1px solid var(--pink-line);text-align:center;font-variant-numeric:tabular-nums}
th{background:var(--pink-bg);font-weight:900;font-size:11.5px}
td:first-child,th:first-child{text-align:left;font-weight:700;position:sticky;left:0;background:var(--win)}
th:first-child{background:var(--pink-bg)}
tr.used td{background:var(--yellow)}

/* 탭바 */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--win);border-top:2px solid var(--ink)}
@media (min-width:601px){.tabbar{border-inline:2px solid var(--ink)}}
.tabbar button{display:grid;justify-items:center;gap:1px;min-height:52px;border:0;border-radius:14px;background:transparent;font-size:11.5px;font-weight:900;color:var(--ink-soft);cursor:pointer}
.tabbar button span{font-size:22px;line-height:1.1}
.tabbar button[aria-current="page"]{background:var(--pink-bg);color:var(--ink)}

/* 시트 */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(74,43,60,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);max-height:92vh;display:flex;flex-direction:column;background:var(--win);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{position:relative;display:flex;align-items:center;gap:10px;padding:18px 16px 10px;border-bottom:1.5px solid var(--pink-line)}
.sheet-h b{font-size:16.5px;font-weight:900;flex:1;min-width:0}
.grab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:40px;height:5px;border-radius:9px;background:var(--pink-line)}
.close{flex:none;width:36px;height:36px;border:2px solid var(--ink);border-radius:10px;background:var(--win);font-weight:900;cursor:pointer}
.sheet-b{padding:14px 16px;overflow-y:auto;display:grid;gap:12px}
.sheet-f{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 16px 14px;border-top:1.5px solid var(--pink-line)}
.sheet-f.col{flex-direction:column;align-items:stretch}
.sheet-f .btn:not(.sm){flex:1}
.ch-who{display:grid;flex:1;min-width:0}
.ch-who b{font-size:16px}
.ch-who small{font-size:12px;color:var(--ink-soft)}
.sheet.chat{height:92vh}

function applyProposal(p){
  const cur = {...(S.days[p.date] || {})};
  if (p.fields) Object.entries(p.fields).forEach(([k, v]) => { if (v) cur[k] = v; else delete cur[k]; });
  else if (p.value) cur[p.field] = p.value; else delete cur[p.field];
  cur.plan = false;
  if (hasData(cur)) S.days[p.date] = cur; else delete S.days[p.date];
  p.status = "approved"; p.decidedAt = new Date().toISOString();
}

function answerLocal(q, prefer){

  if (/수유|분유|모유/.test(q)) out.push({s:"chong", text: GUIDE_LINES.filter(l => /수유/.test(l)).join("\n")});
  if (/원칙|오전에|주의할\s*점/.test(q)) out.push({s:"samil", text: GUIDE_LINES.filter(l => /기본 원칙/.test(l)).join("\n").replace(/ \/ /g, "\n- ")});

  if (date && !/테스트|알레르기|반응/.test(q)) { const l = dayLine(date); out.push({s:"obi", text: l ? `${md(date)} 식단\n${l.split("] ")[1].split(" | ").map(x => "- " + x).join("\n")}` : `${md(date)} 식단이 비어 있어요.`}); }

  knownFoods().filter(n => q.includes(n)).slice(0, 2).forEach(n => out.push({s: ALLERGENS.includes(n) ? "samil" : "mieum", text: foodReport(n)}));
  INTENTS.forEach(([re, id]) => { if (re.test(q) && !out.some(o => o.s === id && o.report)) out.push({s:id, report:true}); });
  if (!out.length && prefer) out.push({s:prefer, report:true});

}

async function submitPlan(start){

  if (past && amountQ && !e.foods.length && !e.unk && !implicit) { score.amount = (score.amount || 0) + 6; delete score.day_menu; if (/다\s*먹|더\s*(달라|먹으려|찾)|모자라|부족/.test(q)) score.increase = (score.increase || 0) + 9; }

  substitute(q, s, e){
