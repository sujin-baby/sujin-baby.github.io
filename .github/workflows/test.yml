# 체험단 자동화 스크립트 검사: 문법(node -c), Code.gs ESLint, 단위 테스트(ci_test.js)
name: test

on:
  push:
    paths: ['ori/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['ori/**', '.github/workflows/test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 문법 검사 (node -c)
        run: |
          node -c ori/Main.js
          # .gs는 확장자를 node가 몰라서 .js로 복사해서 검사
          cp ori/Code.gs "$RUNNER_TEMP/Code.js" && node -c "$RUNNER_TEMP/Code.js"
          for f in ori/ext/*.js ori/test/*.js; do node -c "$f"; done
      - name: Code.gs ESLint (문법·파싱 오류)
        run: npx -y eslint@8.57.0 --no-eslintrc --env es2021 --parser-options ecmaVersion:2022 ori/Code.gs
      - name: 단위 테스트
        run: TZ=Asia/Seoul node ori/test/ci_test.js
