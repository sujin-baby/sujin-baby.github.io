# 체험단 자동화 스크립트 검사 (ori/test/run_ci.sh). 실서비스 반영은 deploy.yml (ori-dev → 통과하면 실서비스 브랜치)
name: test

on:
  push:
    paths: ['ori/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['ori/**', '.github/workflows/test.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 시험 (문법, Code.gs ESLint, 단위 시험)
        run: bash ori/test/run_ci.sh
